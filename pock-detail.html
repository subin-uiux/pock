  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/common.css">

<body class="page page--pock-detail">
  <!--
    pock-detail.html
    역할: POCK 상세 화면
    상태별 UI (하나의 HTML에서 분기):
      - LOCKED   : 아직 열 수 없음
      - OPENING  : 공개 시점 도달, 열기 가능
      - OPENED   : 이미 열람함
    body 또는 루트에 modifier 클래스로 상태 표시 예정
    예: .pock-detail--locked | .pock-detail--opening | .pock-detail--opened
  -->

  <div class="page__wrapper">
    <header class="header">
      <!-- 공통 헤더 (추후 구현) -->
    </header>

    <main class="main main--pock-detail">
      <article class="pock-detail" data-status="locked">
        <!-- 상태별 상세 UI (추후 구현) -->
      </article>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script src="js/pock.js"></script>
  <script src="js/pages/pock-detail.js"></script>
</body>
</html>
